name: Package Blender Addon

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "__init__.py"
      - "assets/**"
      - "src/**"
      - "version.json"
      - "scripts/package_addon.py"
      - "scripts/upload_addon_to_r2.py"
      - "scripts/validate_feature_chain.py"
      - "scripts/validate_orbisauth_sdk.py"
      - "scripts/versioning.py"
      - "tests/test_feature_chain.py"
      - "tests/test_orbisauth_sdk.py"
      - "tests/test_feature_access.py"
      - "tests/test_license_api.py"
      - "tests/test_license_manager.py"
      - ".github/workflows/package-addon.yml"
  pull_request:
    paths:
      - "__init__.py"
      - "assets/**"
      - "src/**"
      - "version.json"
      - "scripts/package_addon.py"
      - "scripts/upload_addon_to_r2.py"
      - "scripts/validate_feature_chain.py"
      - "scripts/validate_orbisauth_sdk.py"
      - "scripts/versioning.py"
      - "tests/test_feature_chain.py"
      - "tests/test_orbisauth_sdk.py"
      - "tests/test_feature_access.py"
      - "tests/test_license_api.py"
      - "tests/test_license_manager.py"
      - ".github/workflows/package-addon.yml"

jobs:
  package-addon:
    name: Package Addon
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall src scripts tests

      - name: Validate managed native feature chain
        run: python scripts/validate_feature_chain.py

      - name: Validate vendored Orbisauth SDK contract
        run: python scripts/validate_orbisauth_sdk.py

      - name: Run licensing contract tests
        run: |
          python -m unittest \
            tests.test_feature_chain \
            tests.test_orbisauth_sdk \
            tests.test_feature_access \
            tests.test_license_api \
            tests.test_license_manager

      - name: Resolve addon version
        id: version
        run: |
          echo "semver=$(python scripts/versioning.py show --format semver)" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        run: python scripts/package_addon.py --compresslevel 9

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: rig2-addon-${{ steps.version.outputs.semver }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Install upload dependencies
        if: github.event_name != 'pull_request'
        run: pip install boto3

      - name: Upload addon zip to R2
        if: github.event_name != 'pull_request'
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET_NAME: public-assets
        run: |
          python scripts/upload_addon_to_r2.py \
            --artifact "dist/rig2_addons-${{ steps.version.outputs.semver }}.zip" \
            --storage-prefix rig2 \
            --latest-key rig2/latest.zip
