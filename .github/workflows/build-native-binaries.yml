name: Build Native Binaries

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "native_cpp/**"
      - "src/services/**"
      - "src/licensing/**"
      - "scripts/extract_native_from_wheels.py"
      - "scripts/generate_integrity_hashes.py"
      - "scripts/upload_to_r2.py"
      - ".github/workflows/build-native-binaries.yml"
  pull_request:
    paths:
      - "native_cpp/**"
      - "src/services/**"
      - "src/licensing/**"
      - "scripts/extract_native_from_wheels.py"
      - "scripts/generate_integrity_hashes.py"
      - "scripts/upload_to_r2.py"
      - ".github/workflows/build-native-binaries.yml"

jobs:
  build-wheels:
    name: Build Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cibw_archs: "x86_64 aarch64"
            cibw_arch_env_key: "CIBW_ARCHS_LINUX"
          - os: macos-14
            cibw_archs: "x86_64 arm64"
            cibw_arch_env_key: "CIBW_ARCHS_MACOS"
          - os: windows-2022
            cibw_archs: "AMD64 ARM64"
            cibw_arch_env_key: "CIBW_ARCHS_WINDOWS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate integrity hashes header
        run: python scripts/generate_integrity_hashes.py

      - name: Setup QEMU (Linux cross-arch)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Install build tools
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Configure cibuildwheel architecture env
        shell: bash
        run: |
          echo "${{ matrix.cibw_arch_env_key }}=${{ matrix.cibw_archs }}" >> "$GITHUB_ENV"

      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "pp* *-musllinux_* *-manylinux_i686 *-win32"
          CIBW_ENVIRONMENT: "RIG2_ENABLE_ABI3=1"
          CIBW_TEST_COMMAND: "python -c \"import rig2_miframes, rig2_face_cap; print(rig2_miframes.backend_name(), rig2_face_cap.backend_name())\""
        run: python -m cibuildwheel native_cpp --output-dir wheelhouse

      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  package-native:
    name: Package Runtime Binaries
    runs-on: ubuntu-22.04
    needs: build-wheels

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true

      - name: Extract runtime native binaries
        run: |
          python scripts/extract_native_from_wheels.py \
            --wheelhouse wheelhouse \
            --output native_dist

      - name: Show extracted layout
        run: find native_dist -type f | sort

      - name: Verify extracted runtime layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("native_dist")
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file())
          print("\n".join(files))
          allowed_tags = {
              "darwin-x86_64-abi3",
              "darwin-arm64-abi3",
              "linux-x86_64-abi3",
              "linux-arm64-abi3",
              "win32-x86_64-abi3",
              "win32-arm64-abi3",
          }
          bad = []
          for rel in files:
              parts = rel.split("/")
              if len(parts) != 2:
                  bad.append(f"unexpected depth: {rel}")
                  continue
              tag, name = parts
              if tag not in allowed_tags:
                  bad.append(f"unexpected tag: {rel}")
              if ".abi3." not in name:
                  bad.append(f"non-abi3 filename: {rel}")
              if not (name.startswith("rig2_face_cap") or name.startswith("rig2_miframes")):
                  bad.append(f"unexpected module name: {rel}")
          if bad:
              raise SystemExit("Invalid runtime layout:\n" + "\n".join(bad))
          PY

      - name: Upload runtime binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: native_dist/**
          if-no-files-found: error

  upload-r2:
    name: Upload to Cloudflare R2
    runs-on: ubuntu-22.04
    needs: package-native
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download native binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: native_dist

      - name: Install upload dependencies
        run: pip install boto3

      - name: Upload to R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/upload_to_r2.py \
            --binary-dir native_dist \
            --storage-prefix rig2
