name: Build Native Binaries

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "native_cpp/**"
      - "src/services/**"
      - "src/licensing/**"
      - "src/modules/r2bb/mapping.py"
      - "scripts/extract_native_from_wheels.py"
      - "scripts/generate_integrity_hashes.py"
      - "scripts/generate_orbisauth_trust.py"
      - "scripts/generate_native_manifests.py"
      - "scripts/native_artifacts.py"
      - "scripts/validate_feature_chain.py"
      - "scripts/upload_to_r2.py"
      - "scripts/verify_native_dist.py"
      - ".github/workflows/build-native-binaries.yml"
  pull_request:
    paths:
      - "native_cpp/**"
      - "src/services/**"
      - "src/licensing/**"
      - "src/modules/r2bb/mapping.py"
      - "scripts/extract_native_from_wheels.py"
      - "scripts/generate_integrity_hashes.py"
      - "scripts/generate_orbisauth_trust.py"
      - "scripts/generate_native_manifests.py"
      - "scripts/native_artifacts.py"
      - "scripts/validate_feature_chain.py"
      - "scripts/upload_to_r2.py"
      - "scripts/verify_native_dist.py"
      - ".github/workflows/build-native-binaries.yml"

jobs:
  build-wheels:
    name: Build Wheels (${{ matrix.job_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            job_name: "linux-x86_64"
            artifact_name: "linux-x86_64"
            cibw_archs: "x86_64"
            cibw_arch_env_key: "CIBW_ARCHS_LINUX"
          - os: ubuntu-22.04-arm
            job_name: "linux-aarch64"
            artifact_name: "linux-aarch64"
            cibw_archs: "aarch64"
            cibw_arch_env_key: "CIBW_ARCHS_LINUX"
          - os: macos-14
            job_name: "macos-14"
            artifact_name: "macos-14"
            cibw_archs: "x86_64 arm64"
            cibw_arch_env_key: "CIBW_ARCHS_MACOS"
          - os: windows-2022
            job_name: "windows-2022"
            artifact_name: "windows-2022"
            cibw_archs: "AMD64 ARM64"
            cibw_arch_env_key: "CIBW_ARCHS_WINDOWS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile Python sources
        run: python -m compileall src scripts native_cpp

      - name: Generate integrity hashes header
        run: |
          python scripts/generate_orbisauth_trust.py
          python scripts/generate_integrity_hashes.py

      - name: Validate managed native feature chain
        run: python scripts/validate_feature_chain.py

      - name: Install build tools
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Configure cibuildwheel architecture env
        shell: bash
        run: |
          echo "${{ matrix.cibw_arch_env_key }}=${{ matrix.cibw_archs }}" >> "$GITHUB_ENV"

      - name: Build wheels
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "pp* *-musllinux_* *-manylinux_i686 *-win32"
          CIBW_ENVIRONMENT: "RIG2_ENABLE_ABI3=1 RIG2_DEV_BUILD=0"
          CIBW_TEST_COMMAND: "python -c \"import rig2_miframes, rig2_face_cap, rig2_r2bb; print(rig2_miframes.backend_name(), rig2_face_cap.backend_name(), rig2_r2bb.backend_name())\""
        run: python -m cibuildwheel native_cpp --output-dir wheelhouse

      - name: Verify wheel compatibility tags
        shell: bash
        run: |
          python - <<'PY'
          import pathlib

          wheels = sorted(pathlib.Path("wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheels produced")

          invalid = []
          for wheel in wheels:
              parts = wheel.name[:-4].split("-")
              if len(parts) < 5:
                  invalid.append(f"{wheel.name} (invalid wheel filename)")
                  continue

              python_tag = parts[-3]
              abi_tag = parts[-2]
              if abi_tag != "abi3":
                  invalid.append(f"{wheel.name} (expected abi3 ABI tag, got {abi_tag})")
                  continue
              if not python_tag.startswith("cp3"):
                  invalid.append(f"{wheel.name} (unexpected python tag {python_tag})")

          if invalid:
              raise SystemExit("invalid wheels detected:\n" + "\n".join(invalid))

          print("verified abi3 wheel tags:", len(wheels))
          PY

      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.artifact_name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  package-native:
    name: Package Runtime Binaries
    runs-on: ubuntu-22.04
    needs: build-wheels

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          merge-multiple: true

      - name: Extract runtime native binaries
        run: |
          python scripts/extract_native_from_wheels.py \
            --wheelhouse wheelhouse \
            --output native_dist

      - name: Show extracted layout
        run: find native_dist -type f | sort

      - name: Verify extracted runtime layout
        run: |
          python scripts/verify_native_dist.py native_dist --require-complete-matrix

      - name: Generate native licensing manifests
        run: |
          python scripts/generate_native_manifests.py \
            --binary-dir native_dist \
            --output-dir native_manifests

      - name: Upload runtime binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: native_dist/**
          if-no-files-found: error

      - name: Upload native manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-manifests
          path: native_manifests/**
          if-no-files-found: error

  upload-r2:
    name: Upload to Cloudflare R2
    runs-on: ubuntu-22.04
    needs: package-native
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download native binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: native_dist

      - name: Download native manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: native-manifests
          path: native_manifests

      - name: Install upload dependencies
        run: pip install boto3

      - name: Upload to R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/upload_to_r2.py \
            --binary-dir native_dist \
            --manifest-dir native_manifests \
            --storage-prefix rig2
